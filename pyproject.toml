[project]
name = "tt-harness-handheld-vga"
version = "0.0.0"
description = "FPGA harness for running Tiny Tapeout demo designs on handheld-console FPGA boards"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "litex",
    "litex-boards",
    "migen",
    "pyyaml",
]

[project.scripts]
tt-harness = "tt_harness.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tt_harness"]

[tool.uv.sources]
migen = { git = "https://github.com/m-labs/migen", rev = "e19524c963a8342952840983047557707fbe0b6a" }
litex = { git = "https://github.com/enjoy-digital/litex", tag = "2026.08" }
litex-boards = { git = "https://github.com/litex-hub/litex-boards", tag = "2026.08" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=tmp/pytest"
markers = [
    "toolchain: needs the open-source toolchains installed under .toolchains/",
    "vivado: needs a Vivado installation",
    "board: uses a real FPGA board over SSH; deselected unless --board is given",
    "slow: exhaustive simulation sweeps; not needed for every run; run them before merging changes to the code they cover (skipped unless --run-slow or -m mentions slow)",
]

[tool.ruff]
line-length = 100
